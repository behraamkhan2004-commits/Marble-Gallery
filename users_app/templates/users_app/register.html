{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="register-container">
    <div class="register-card">
        <div class="register-header">
            <i class="fas fa-user-plus register-icon"></i>
            <h2>Create Account</h2>
            <p>Join Marble Gallery today</p>
        </div>
        
        <form method="post" class="register-form">
            {% csrf_token %}
            
            <div class="input-group">
                <i class="fas fa-user input-icon"></i>
                <input type="text" name="username" class="register-input" placeholder="Username" required>
            </div>
            
            <div class="input-group">
                <i class="fas fa-envelope input-icon"></i>
                <input type="email" name="email" class="register-input" placeholder="Email" required>
            </div>
            
            <div class="input-group">
                <i class="fas fa-phone input-icon"></i>
                <input type="tel" name="phone_number" class="register-input" placeholder="Phone Number" required>
            </div>
            
            <div class="input-group">
                <i class="fas fa-lock input-icon"></i>
                <input type="password" name="password1" class="register-input" placeholder="Password" required>
            </div>
            
            <div class="input-group">
                <i class="fas fa-check-circle input-icon"></i>
                <input type="password" name="password2" class="register-input" placeholder="Confirm Password" required>
            </div>
            
            <button type="submit" class="register-btn">
                <i class="fas fa-user-plus"></i> Register
            </button>
        </form>
<div class="social-login-section">
    <hr>
    <p class="text-center">Or register with</p>
    <div class="social-buttons">
        <a href="{% url 'social:begin' 'google-oauth2' %}" class="btn-google">
            <i class="fab fa-google"></i> Google
        </a>
        <a href="{% url 'social:begin' 'facebook' %}" class="btn-facebook">
            <i class="fab fa-facebook-f"></i> Facebook
        </a>
    </div>
</div>
        
        <div class="register-footer">
            <p>Already have an account? <a href="/users/login/">Login here</a></p>
        </div>
    </div>
</div>

<style>
    .social-register {
    margin-top: 25px;
}

.social-register hr {
    margin: 20px 0;
    border-color: #e0e0e0;
}

.social-register p {
    color: #666;
    font-size: 14px;
}

.btn-google {
    background: #DB4437;
    color: white;
    padding: 10px;
    border-radius: 8px;
    text-decoration: none;
    display: inline-block;
    font-weight: 500;
    transition: all 0.3s;
}

.btn-google:hover {
    background: #c53929;
    transform: translateY(-2px);
    color: white;
}

.btn-facebook {
    background: #4267B2;
    color: white;
    padding: 10px;
    border-radius: 8px;
    text-decoration: none;
    display: inline-block;
    font-weight: 500;
    transition: all 0.3s;
}

.btn-facebook:hover {
    background: #365899;
    transform: translateY(-2px);
    color: white;
}

.d-flex {
    display: flex;
}

.gap-3 {
    gap: 15px;
}

.w-50 {
    width: 50%;
}

.text-center {
    text-align: center;
}
    .register-container {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        padding: 40px 20px;
    }
    
    .register-card {
        background: white;
        border-radius: 20px;
        padding: 40px;
        width: 100%;
        max-width: 500px;
        box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
        animation: fadeInUp 0.6s ease-out;
    }
    
    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    .register-header {
        text-align: center;
        margin-bottom: 30px;
    }
    
    .register-icon {
        font-size: 60px;
        color: #c9a03d;
        margin-bottom: 15px;
    }
    
    .register-header h2 {
        font-size: 28px;
        font-weight: 700;
        color: #1a1a2e;
        margin-bottom: 8px;
    }
    
    .register-header p {
        color: #666;
        font-size: 14px;
    }
    
    .register-form {
        margin-bottom: 20px;
    }
    
    .input-group {
        position: relative;
        margin-bottom: 18px;
    }
    
    .input-icon {
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: #c9a03d;
        font-size: 18px;
    }
    
    .register-input {
        width: 100%;
        padding: 14px 15px 14px 45px;
        border: 2px solid #e0e0e0;
        border-radius: 12px;
        font-size: 16px;
        transition: all 0.3s;
        outline: none;
    }
    
    .register-input:focus {
        border-color: #c9a03d;
        box-shadow: 0 0 0 3px rgba(201,160,61,0.1);
    }
    
    .register-btn {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #c9a03d 0%, #a8862c 100%);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        margin-top: 10px;
    }
    
    .register-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(201,160,61,0.3);
    }
    
    .register-footer {
        text-align: center;
        padding-top: 20px;
        border-top: 1px solid #eee;
    }
    
    .register-footer p {
        color: #666;
        font-size: 14px;
    }
    
    .register-footer a {
        color: #c9a03d;
        text-decoration: none;
        font-weight: 600;
    }
    
    .register-footer a:hover {
        text-decoration: underline;
    }
</style>
{% endblock %}
