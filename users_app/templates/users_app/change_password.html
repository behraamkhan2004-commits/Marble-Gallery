{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="change-password-page">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="password-card">
                    <div class="password-header">
                        <i class="fas fa-key"></i>
                        <h2>Change Password</h2>
                        <p>Update your account password</p>
                    </div>
                    
                    <form method="post" class="password-form">
                        {% csrf_token %}
                        
                        <div class="form-group">
                            <label><i class="fas fa-lock"></i> Current Password</label>
                            <input type="password" name="old_password" class="form-control" placeholder="Enter current password" required>
                        </div>
                        
                        <div class="form-group">
                            <label><i class="fas fa-lock"></i> New Password</label>
                            <input type="password" name="new_password1" class="form-control" placeholder="Enter new password" required>
                        </div>
                        
                        <div class="form-group">
                            <label><i class="fas fa-lock"></i> Confirm New Password</label>
                            <input type="password" name="new_password2" class="form-control" placeholder="Confirm new password" required>
                        </div>
                        
                        <div class="form-actions">
                            <button type="submit" class="btn-change">
                                <i class="fas fa-save"></i> Change Password
                            </button>
                            <a href="/users/profile/" class="btn-cancel">
                                <i class="fas fa-times"></i> Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .change-password-page {
        background: #f5f7fa;
        min-height: 100vh;
        padding: 60px 0;
    }

    .password-card {
        background: white;
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.08);
    }

    .password-header {
        text-align: center;
        margin-bottom: 30px;
    }

    .password-header i {
        font-size: 60px;
        color: #c9a03d;
        margin-bottom: 15px;
    }

    .password-header h2 {
        font-size: 28px;
        font-weight: 700;
        color: #1a1a2e;
        margin-bottom: 8px;
    }

    .password-header p {
        color: #666;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
        color: #333;
    }

    .form-group label i {
        color: #c9a03d;
        margin-right: 8px;
    }

    .form-control {
        width: 100%;
        padding: 12px 15px;
        border: 2px solid #e0e0e0;
        border-radius: 12px;
        font-size: 15px;
        transition: all 0.3s;
    }

    .form-control:focus {
        border-color: #c9a03d;
        outline: none;
        box-shadow: 0 0 0 3px rgba(201,160,61,0.1);
    }

    .form-actions {
        display: flex;
        gap: 15px;
        margin-top: 25px;
    }

    .btn-change {
        flex: 1;
        padding: 12px;
        background: #c9a03d;
        color: white;
        border: none;
        border-radius: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
    }

    .btn-change:hover {
        background: #a8862c;
        transform: translateY(-2px);
    }

    .btn-cancel {
        flex: 1;
        padding: 12px;
        background: #f5f5f5;
        color: #333;
        text-align: center;
        text-decoration: none;
        border-radius: 12px;
        font-weight: 600;
        transition: all 0.3s;
    }

    .btn-cancel:hover {
        background: #e0e0e0;
        transform: translateY(-2px);
    }
</style>
{% endblock %}
