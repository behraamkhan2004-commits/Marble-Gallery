{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="edit-profile-page">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="edit-card">
                    <div class="edit-header">
                        <i class="fas fa-user-edit"></i>
                        <h2>Edit Profile</h2>
                        <p>Update your personal information</p>
                    </div>
                    
                    <form method="post" class="edit-form">
                        {% csrf_token %}
                        
                        <div class="form-group">
                            <label><i class="fas fa-user"></i> First Name</label>
                            <input type="text" name="first_name" class="form-control" value="{{ user.first_name }}">
                        </div>
                        
                        <div class="form-group">
                            <label><i class="fas fa-user"></i> Last Name</label>
                            <input type="text" name="last_name" class="form-control" value="{{ user.last_name }}">
                        </div>
                        
                        <div class="form-group">
                            <label><i class="fas fa-user-tag"></i> Username</label>
                            <input type="text" name="username" class="form-control" value="{{ user.username }}" required>
                        </div>
                        
                        <div class="form-group">
                            <label><i class="fas fa-envelope"></i> Email</label>
                            <input type="email" name="email" class="form-control" value="{{ user.email }}" required>
                        </div>
                        
                        <div class="form-group">
                            <label><i class="fas fa-phone"></i> Phone Number</label>
                            <input type="tel" name="phone_number" class="form-control" value="{{ user.phone_number }}">
                        </div>
                        
                        <div class="form-actions">
                            <button type="submit" class="btn-save">
                                <i class="fas fa-save"></i> Save Changes
                            </button>
                            <a href="/users/profile/" class="btn-cancel">
                                <i class="fas fa-times"></i> Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .edit-profile-page {
        background: #f5f7fa;
        min-height: 100vh;
        padding: 60px 0;
    }

    .edit-card {
        background: white;
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.08);
    }

    .edit-header {
        text-align: center;
        margin-bottom: 30px;
    }

    .edit-header i {
        font-size: 60px;
        color: #c9a03d;
        margin-bottom: 15px;
    }

    .edit-header h2 {
        font-size: 28px;
        font-weight: 700;
        color: #1a1a2e;
        margin-bottom: 8px;
    }

    .edit-header p {
        color: #666;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
        color: #333;
    }

    .form-group label i {
        color: #c9a03d;
        margin-right: 8px;
    }

    .form-control {
        width: 100%;
        padding: 12px 15px;
        border: 2px solid #e0e0e0;
        border-radius: 12px;
        font-size: 15px;
        transition: all 0.3s;
    }

    .form-control:focus {
        border-color: #c9a03d;
        outline: none;
        box-shadow: 0 0 0 3px rgba(201,160,61,0.1);
    }

    .form-actions {
        display: flex;
        gap: 15px;
        margin-top: 25px;
    }

    .btn-save {
        flex: 1;
        padding: 12px;
        background: #c9a03d;
        color: white;
        border: none;
        border-radius: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
    }

    .btn-save:hover {
        background: #a8862c;
        transform: translateY(-2px);
    }

    .btn-cancel {
        flex: 1;
        padding: 12px;
        background: #f5f5f5;
        color: #333;
        text-align: center;
        text-decoration: none;
        border-radius: 12px;
        font-weight: 600;
        transition: all 0.3s;
    }

    .btn-cancel:hover {
        background: #e0e0e0;
        transform: translateY(-2px);
    }
</style>
{% endblock %}
