{% extends 'base.html' %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-5">
                    <i class="fas fa-times-circle fa-5x text-danger mb-4"></i>
                    <h2 class="fw-bold mb-3">Payment Failed!</h2>
                    <p class="lead">Your payment could not be processed.</p>
                    <p>{{ error_message }}</p>
                    <hr>
                    <a href="/cart/" class="btn btn-primary">Try Again</a>
                    <a href="/contact/" class="btn btn-outline-secondary ms-2">Contact Support</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
